<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFCF6">
<title>歐洲維也納之行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;--cream:#FFF6DA;--b:3px solid #3E3A39}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;font-size:16px;line-height:1.6;padding-top:60px;padding-bottom:40px;-webkit-text-size-adjust:100%}
body.admin{padding-bottom:96px}
h1,h2,h3,h4,p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
main{max-width:760px;margin:0 auto;padding:16px 14px 0}
.sec{margin-top:34px}
.pw{white-space:pre-wrap}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;height:56px;z-index:50;background:var(--paper);border-bottom:var(--b);display:flex;align-items:center;gap:8px;padding:0 10px}
.brand{display:flex;align-items:center;gap:6px;flex:none;font-weight:700;text-decoration:none}
.brand span{display:none}
.brand svg{width:34px;height:34px;display:block}
.nav-links{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:4px 2px}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{flex:none;text-decoration:none;border:var(--b);border-radius:999px;padding:1px 12px;font-size:14px;background:var(--paper)}
.nav-links a.on{background:var(--yellow)}
.nav-adm{flex:none;border:var(--b);background:var(--sky);border-radius:999px;padding:1px 12px;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.nav-adm:active{transform:translateY(3px);box-shadow:none}
body.admin .nav-adm{background:var(--coral)}
@media(min-width:520px){.brand span{display:inline}}

/* common */
.card{background:var(--paper);border:var(--b);border-radius:26px;box-shadow:0 4px 0 var(--ink);padding:16px}
.chip{display:inline-block;border:var(--b);border-radius:999px;padding:0 12px;font-size:14px;background:var(--paper)}
.c-y{background:var(--yellow)}.c-c{background:var(--coral)}.c-s{background:var(--sky)}.c-g{background:var(--green)}
.st{display:inline-flex;align-items:center;gap:8px;border:var(--b);border-radius:999px;padding:3px 18px 3px 10px;font-size:20px;margin-bottom:14px;box-shadow:0 3px 0 var(--ink)}
.st svg{width:28px;height:28px;flex:none}
.btn{border:var(--b);background:var(--yellow);border-radius:999px;padding:6px 16px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-size:15px}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pri{background:var(--coral)}
.btn.sm{padding:2px 12px;font-size:14px}
.mini{border:var(--b);background:var(--paper);border-radius:999px;min-width:32px;height:32px;padding:0 8px;cursor:pointer;line-height:1;font-size:14px}
.mini:active{background:var(--coral)}
:focus-visible{outline:3px dashed var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{padding:0;overflow:hidden}
.hero-art{border-bottom:var(--b);line-height:0;background:var(--sky)}
.hero-art svg{width:100%;height:auto;display:block}
.hero-body{padding:16px 16px 18px;text-align:center}
.eyebrow{font-size:14px;letter-spacing:.12em}
.hero h1{font-size:32px;line-height:1.25;margin:4px 0 2px}
.sub{font-size:15px}
.range{margin:10px 0 4px}
.cd-l{font-size:14px;margin-top:10px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px auto 0;max-width:340px}
.cd-b{border:var(--b);border-radius:18px;padding:4px 0 2px;line-height:1.2}
.cd-b b{display:block;font-size:26px;font-weight:400}
.cd-b small{font-size:12px}
.cd-msg{margin:8px auto 0;border:var(--b);border-radius:18px;background:var(--green);padding:8px 12px;max-width:340px}
.hint{margin-top:12px;font-size:14px}
.adm-box{display:grid;gap:8px;margin:12px auto 0;max-width:340px;text-align:left}
.adm-box label{display:grid;gap:2px;font-size:13px}
input[type=datetime-local],.fld input{border:var(--b);border-radius:14px;padding:6px 10px;background:var(--paper)}

/* flights */
.fl{margin-bottom:16px;position:relative}
.fl::before,.fl::after{content:"";position:absolute;top:50%;width:18px;height:18px;border:var(--b);border-radius:50%;background:var(--paper);margin-top:-9px}
.fl::before{left:-12px;clip-path:inset(0 0 0 50%)}
.fl::after{right:-12px;clip-path:inset(0 50% 0 0)}
.fl-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fl-r{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.fl-e{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.fl-e.r{text-align:right;align-items:flex-end}
.fl-e .code{font-size:30px;font-weight:400;letter-spacing:.04em}
.fl-e em{font-style:normal;font-size:14px;background:var(--cream);border-radius:10px;padding:0 6px;margin-top:2px}
.fl-m{width:70px}
.fl-m svg{width:100%;display:block}
.fl-f{border-top:3px dashed var(--ink);margin-top:12px;padding-top:8px;font-size:14px}

/* day tabs */
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;padding:4px 4px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;min-width:66px;border:var(--b);border-radius:20px;background:var(--paper);padding:4px 10px 3px;cursor:pointer;box-shadow:0 3px 0 var(--ink);line-height:1.25}
.tab b{font-weight:400;font-size:17px}
.tab small{font-size:11px;white-space:nowrap}
.tab.on{background:var(--coral)}
.tab.bnc{animation:bounce .55s cubic-bezier(.3,1.6,.5,1)}
.dh{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:center;background:var(--cream)}
.dh-art{border:var(--b);border-radius:20px;overflow:hidden;line-height:0}
.dh-art svg{width:100%;height:auto;display:block}
.dh-date{font-size:14px}
.dh h3{font-size:24px;line-height:1.3}
.dh-s{font-size:15px}
.dh-a{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:3px dashed var(--ink);padding-top:10px}
select{border:var(--b);border-radius:14px;padding:3px 8px;background:var(--paper);max-width:100%}
.tl{list-style:none;margin:18px 0 0;padding:0 0 0 28px;position:relative}
.tl::before{content:"";position:absolute;left:10px;top:10px;bottom:10px;width:3px;background:var(--ink);border-radius:2px}
.it{position:relative;margin:0 0 14px;border:var(--b);border-radius:22px;padding:10px 14px 12px;background:var(--paper)}
.it::before{content:"";position:absolute;left:-27px;top:16px;width:18px;height:18px;border:var(--b);border-radius:50%;background:var(--c,var(--paper))}
.it::after{content:"";position:absolute;left:-9px;top:23px;width:9px;height:3px;background:var(--ink)}
.it.is-must{background:var(--cream)}
.it-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:6px}
.time{font-size:14px;background:var(--paper);border:var(--b);border-radius:999px;padding:0 10px}
.tag{font-size:13px;border:var(--b);border-radius:999px;padding:0 10px;background:var(--c,var(--paper))}
.tag[data-t="步行"]{border-style:dashed}
.must{font-size:13px;border:var(--b);border-radius:999px;padding:0 10px;background:var(--coral)}
.it-t{font-size:18px;line-height:1.4;margin-top:4px;font-weight:400}
.it-d{font-size:14.5px;margin-top:2px}
.lk{display:inline-block;margin-top:6px;font-size:13.5px;border:var(--b);border-radius:999px;padding:0 12px;text-decoration:none;background:var(--sky);box-shadow:0 2px 0 var(--ink)}
.it-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.empty{border:3px dashed var(--ink);border-radius:22px;padding:14px;text-align:center;margin-top:16px}
.dnav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}

/* stays */
.sg{display:grid;gap:14px}
.stay{display:grid;grid-template-columns:54px 1fr;gap:12px}
.stay-i{width:54px;height:54px;border:var(--b);border-radius:18px;display:grid;place-items:center}
.stay-i svg{width:34px;height:34px}
.stay h3{font-size:19px;line-height:1.4}
.stay p{font-size:14.5px}
.stay .meta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}

/* checklist */
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
.bar{flex:1;height:16px;border:var(--b);border-radius:999px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-right:3px solid var(--ink);transition:width .35s}
.bar i[style*="width:0%"]{border-right:0}
.chk{display:flex;align-items:flex-start;gap:10px;padding:5px 0}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:28px;height:28px;border:var(--b);border-radius:10px;background:var(--paper);cursor:pointer;position:relative;margin-top:0}
.chk input:checked+.box{background:var(--green)}
.chk input:checked+.box::after{content:"";position:absolute;left:7px;top:2px;width:8px;height:14px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(40deg)}
.chk input:focus-visible+.box{outline:3px dashed var(--ink);outline-offset:2px}
.chk-t{flex:1;padding-top:1px;cursor:pointer;min-width:0}
.chk input:checked~.chk-t{text-decoration:line-through;opacity:.55}
.pk{margin-bottom:14px}
.pk h3{font-size:19px;margin-bottom:6px}
.pk:nth-child(4n+1){background:#FFF3F0}
.pk:nth-child(4n+2){background:#FFF9E6}
.pk:nth-child(4n+3){background:#EFF7FB}
.pk:nth-child(4n+4){background:#F3F9EE}

footer{text-align:center;margin:40px 0 0;font-size:14px;padding:0 14px}
footer svg{width:150px;display:block;margin:0 auto 6px}

/* admin */
.ed{outline:2px dashed var(--coral);outline-offset:2px;border-radius:6px;min-width:1.5em;display:inline-block;max-width:100%;white-space:pre-wrap;word-break:break-word}
.ed:empty::before{content:attr(data-ph);opacity:.45}
.ed:focus{outline:3px solid var(--coral);background:#fff}
h1 .ed,h3 .ed,.it-t.ed{display:inline-block}
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);border-top:var(--b);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:none;gap:6px;overflow-x:auto}
body.admin .adminbar{display:flex}
.adminbar .btn{flex:none;font-size:14px;padding:3px 12px}
.adminbar b{flex:none;align-self:center;font-weight:400;font-size:14px;background:var(--coral);border:var(--b);border-radius:999px;padding:0 10px}
.ov{position:fixed;inset:0;z-index:100;background:rgba(62,58,57,.35);display:grid;place-items:center;padding:16px}
.dlg{width:100%;max-width:340px;animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
.dlg h3{margin-bottom:10px;font-size:20px}
.fld{display:grid;gap:4px;font-size:14px;margin-bottom:10px}
.err{color:#B3402F;min-height:1.4em;font-size:14px}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:120;background:var(--yellow);border:var(--b);border-radius:999px;padding:4px 18px;font-size:14px;display:none;box-shadow:0 3px 0 var(--ink);max-width:90vw;text-align:center}
.toast.show{display:block;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.admbanner{border:3px dashed var(--ink);background:var(--cream);border-radius:20px;padding:8px 14px;font-size:14px;margin-bottom:14px}

/* svg animation */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.drift2{animation:drift 11s ease-in-out infinite reverse}
.float{animation:floaty 3.6s ease-in-out infinite}
.float2{animation:floaty 4.4s ease-in-out infinite .6s}
.bob{transform-box:fill-box;transform-origin:center;animation:bob 2.4s ease-in-out infinite}
.train{transform:translateX(190px);animation:ride 16s linear infinite}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 2.2s ease-out infinite}
.puff.p2{animation-delay:1.1s}
.wave{animation:wave 3s ease-in-out infinite}
.wave.w2{animation-delay:1.3s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-8px)}50%{transform:translateX(14px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes ride{from{transform:translateX(-170px)}to{transform:translateX(390px)}}
@keyframes puff{0%{transform:translate(0,0) scale(.5);opacity:.95}100%{transform:translate(-16px,-24px) scale(1.2);opacity:0}}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.82) translateY(10px);opacity:.2}55%{transform:scale(1.05) translateY(-4px);opacity:1}100%{transform:none;opacity:1}}
@keyframes bounce{0%{transform:none}30%{transform:translateY(-12px) scale(1.14,.92)}55%{transform:translateY(2px) scale(.96,1.05)}78%{transform:translateY(-3px)}100%{transform:none}}
.pop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
.pop .it{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--n,0)*55ms)}
.pop.tl .it{animation-delay:calc(var(--n,0)*55ms)}
.box::after{transform-origin:center}
.chk input:checked+.box{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}

@media(max-width:380px){.dh{grid-template-columns:96px 1fr}.hero h1{font-size:28px}.fl-e .code{font-size:26px}}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

function fillStays(){
  var cols=['var(--coral)','var(--yellow)','var(--sky)','var(--green)'];
  $('#stays').innerHTML='<h2 class="st c-g">'+ICON.bed+E('ui.stays','標題')+'</h2><div class="sg">'
  +S.stays.map(function(s,i){var b='stays.'+i;
    var map='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent((s.name||'')+' '+(s.city||''));
    return '<article class="card stay"><div class="stay-i" style="background:'+cols[i%4]+'">'+ICON.bed+'</div><div><h3>'+E(b+'.name','住宿名稱')+'</h3>'
     +'<div class="meta"><span class="chip">'+E(b+'.city','城市')+'</span><span class="chip c-y">'+E(b+'.dates','入住日期')+'</span></div>'
     +((admin||s.addr)?'<p class="pw">地址：'+E(b+'.addr','（待填）')+'</p>':'')
     +((admin||s.note)?'<p class="pw">'+E(b+'.note','備註')+'</p>':'')
     +'<p style="margin-top:6px">'+(s.name&&s.name.charAt(0)!=='（'?'<a class="lk" href="'+esc(map)+'" target="_blank" rel="noopener">在地圖上查看 ↗</a> ':'')+(admin?'<button class="mini" data-act="del-stay" data-i="'+i+'">✕ 刪除</button>':'')+'</p></div></article>'}).join('')
  +'</div>'+(admin?'<p style="margin-top:12px"><button class="btn" data-act="add-stay">＋ 新增住宿</button></p>':'');
}

/* ---------- checklists ---------- */
function prog(list){var n=list.length,d=list.filter(function(x){return x.done}).length;return '<div class="prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+d+'"><i style="width:'+(n?Math.round(d/n*100):0)+'%"></i></div><span>'+d+'/'+n+'</span></div>'}
function chk(path,it){
  var id='c-'+path.replace(/\./g,'-');
  return '<div class="chk"><input type="checkbox" id="'+id+'" data-chk="'+path+'"'+(it.done?' checked':'')+'><label class="box" for="'+id+'" aria-hidden="true"></label>'
   +(admin?'<div class="chk-t">'+E(path+'.text','項目')+'</div><button class="mini" data-act="del-chk" data-p="'+path+'" aria-label="刪除項目">✕</button>':'<label class="chk-t" for="'+id+'">'+esc(it.text)+'</label>')+'</div>';
}
function listCard(key){
  return '<div class="card">'+prog(S[key])+S[key].map(function(it,i){return chk(key+'.'+i,it)}).join('')+(admin?'<p style="margin-top:8px"><button class="btn sm" data-act="add-chk" data-k="'+key+'">＋ 新增項目</button></p>':'')+'</div>';
}
function fillLists(){
  $('#todo').innerHTML='<h2 class="st c-y">'+ICON.check+E('ui.todo','標題')+'</h2>'+listCard('todos'.replace('todos','todos'));
  $('#pre').innerHTML='<h2 class="st c-c">'+ICON.list+E('ui.pre','標題')+'</h2>'+listCard('pre');
  fillPack();
}
function fillPack(){
  $('#pack').innerHTML='<h2 class="st c-g">'+ICON.bag+E('ui.pack','標題')+'</h2>'
  +S.pack.map(function(c,i){var b='pack.'+i;
    return '<div class="card pk"><h3>'+E(b+'.cat','分類名稱')+(admin?' <button class="mini" data-act="del-pack" data-i="'+i+'" aria-label="刪除分類">✕ 刪除分類</button>':'')+'</h3>'+prog(c.items)
     +c.items.map(function(it,j){return chk(b+'.items.'+j,it)}).join('')
     +(admin?'<p style="margin-top:8px"><button class="btn sm" data-act="add-chk" data-k="'+b+'.items">＋ 新增項目</button></p>':'')+'</div>'}).join('')
  +(admin?'<button class="btn" data-act="add-pack">＋ 新增分類</button>':'');
}
/* todos is stored under S.todos */

/* ---------- render ---------- */
var io=null;
function observe(){
  if(!('IntersectionObserver' in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var id=en.target.id;document.querySelectorAll('.nav-links a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-nav')===id)})}})},{rootMargin:'-40% 0px -55% 0px'});
  document.querySelectorAll('main section').forEach(function(s){io.observe(s)});
}
function render(){
  document.body.classList.toggle('admin',admin);
  document.title=S.trip.title||'旅遊行程';
  $('#app').innerHTML='<main><section id="home"></section><section id="flights" class="sec"></section><section id="days" class="sec"></section><section id="stays" class="sec"></section><section id="todo" class="sec"></section><section id="pre" class="sec"></section><section id="pack" class="sec"></section></main><footer>'+FOOT+'<p>旅途愉快，記得多拍照 ♪</p></footer>';
  fillNav();fillAdminBar();fillHome();fillFlights();fillDays();fillStays();fillLists();tick();observe();
}

/* ---------- modal ---------- */
function closeModal(){$('#modal').innerHTML=''}
function modal(title,fields,onOk,okText){
  var m=$('#modal');
  m.innerHTML='<div class="ov"><form class="dlg card"><h3>'+esc(title)+'</h3>'+fields.map(function(f){return '<label class="fld">'+esc(f.label)+'<input type="'+(f.type||'text')+'" name="'+f.name+'" placeholder="'+esc(f.ph||'')+'" autocomplete="off"></label>'}).join('')+'<p class="err" id="merr"></p><div class="row"><button type="button" class="btn" data-act="mclose">取消</button><button class="btn pri">'+(okText||'確定')+'</button></div></form></div>';
  var f=m.querySelector('form');
  f.onsubmit=function(ev){ev.preventDefault();var vals={};fields.forEach(function(x){vals[x.name]=f.elements[x.name].value});var r=onOk(vals);if(r===true)closeModal();else $('#merr').textContent=r||''};
  setTimeout(function(){var i=f.querySelector('input');if(i)i.focus()},40);
}

/* ---------- actions ---------- */
function dl(name,text,type){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},600);
}
function delAt(path){var ks=path.split('.'),idx=+ks.pop();var arr=getP(ks.join('.'));if(Array.isArray(arr))arr.splice(idx,1)}
function exportHTML(){
  var clone=document.documentElement.cloneNode(true);
  ['#app','#nav','#adminbar','#modal'].forEach(function(s){var e=clone.querySelector(s);if(e)e.innerHTML=''});
  var t=clone.querySelector('#toast');if(t){t.textContent='';t.className='toast'}
  clone.querySelector('body').className='';
  var seed=JSON.parse(JSON.stringify(S));
  clone.querySelector('#seed').textContent=JSON.stringify(seed,null,1).replace(/</g,'\\u003c');
  var ti=clone.querySelector('title');if(ti)ti.textContent=S.trip.title||'旅遊行程';
  dl('vienna-trip.html','<!DOCTYPE html>\n'+clone.outerHTML,'text/html');
  toast('已下載更新後的網頁');
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,i=+b.dataset.i;
  switch(a){
  case 'tab':go(i,true);break;
  case 'prev':go(cur-1,true);break;
  case 'next':go(cur+1,true);break;
  case 'mclose':closeModal();break;
  case 'login':
    modal('後台登入',[{name:'pw',label:'管理密碼',type:'password',ph:'請輸入密碼'}],function(v){
      if(!passOK(v.pw))return '密碼不正確';
      admin=true;try{sessionStorage.setItem('trip-adm','1')}catch(x){}
      render();toast('已進入後台模式');return true;
    },'登入');break;
  case 'logout':admin=false;try{sessionStorage.removeItem('trip-adm')}catch(x){}render();toast('已離開後台');break;
  case 'add-flight':S.flights.push({label:'新航班',from:'',fromName:'',to:'',toName:'',dep:'',arr:'',no:'',note:''});save();fillFlights();break;
  case 'del-flight':if(confirm('確定刪除這個航班？')){S.flights.splice(i,1);save();fillFlights()}break;
  case 'add-day':S.days.push({date:'新日期',city:'城市',scene:'vienna',title:'',items:[]});cur=S.days.length-1;save();fillTabs(true);renderPanel(true);break;
  case 'del-day':if(S.days.length>1&&confirm('確定刪除這一天？')){S.days.splice(cur,1);if(cur>=S.days.length)cur=S.days.length-1;save();fillTabs(false);renderPanel(true)}else if(S.days.length<=1)toast('至少要保留一天');break;
  case 'mv-day':{var d=+b.dataset.d,n=cur+d;if(n>=0&&n<S.days.length){var t=S.days[cur];S.days[cur]=S.days[n];S.days[n]=t;cur=n;save();fillTabs(true);renderPanel(false)}break}
  case 'add-item':S.days[cur].items.push({t:'',n:'新行程',d:'',g:'',m:false,l:''});save();renderPanel(false);break;
  case 'del-item':S.days[cur].items.splice(i,1);save();renderPanel(false);break;
  case 'mv-item':{var dd=+b.dataset.d,arr=S.days[cur].items,j=i+dd;if(j>=0&&j<arr.length){var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;save();renderPanel(false)}break}
  case 'must':{var it=S.days[cur].items[i];it.m=!it.m;save();renderPanel(false);break}
  case 'add-stay':S.stays.push({name:'新住宿',city:'',dates:'',addr:'',note:''});save();fillStays();break;
  case 'del-stay':if(confirm('確定刪除這個住宿？')){S.stays.splice(i,1);save();fillStays()}break;
  case 'add-chk':{var arr2=getP(b.dataset.k);arr2.push({text:'新項目',done:false});save();fillLists();break}
  case 'del-chk':delAt(b.dataset.p);save();fillLists();break;
  case 'add-pack':S.pack.push({cat:'新分類',items:[]});save();fillPack();break;
  case 'del-pack':if(confirm('確定刪除整個分類？')){S.pack.splice(i,1);save();fillPack()}break;
  case 'export-html':exportHTML();break;
  case 'export-json':dl('vienna-trip-data.json',JSON.stringify(S,null,1),'application/json');toast('已匯出資料');break;
  case 'import-json':$('#imp').click();break;
  case 'reset':if(confirm('要把所有內容還原成網頁內建的預設資料嗎？目前的修改會消失。')){S=JSON.parse($('#seed').textContent);cur=0;save();render();toast('已還原預設')}break;
  case 'chpass':
    modal('修改管理密碼',[{name:'p1',label:'新密碼（至少 4 碼）',type:'password'},{name:'p2',label:'再輸入一次',type:'password'}],function(v){
      if((v.p1||'').length<4)return '密碼至少 4 碼';
      if(v.p1!==v.p2)return '兩次輸入不一致';
      S.passHash=hash(v.p1);save();toast('密碼已更新，記得下載更新後的網頁');return true;
    },'更新');break;
  }
});
$('#imp').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.days)||!o.trip)throw 0;S=o;cur=0;save();render();toast('匯入完成')}catch(x){toast('檔案格式不正確')}};
  r.readAsText(f);e.target.value='';
});
document.addEventListener('input',function(e){
  var t=e.target,p=t.dataset&&t.dataset.path;if(!p)return;
  var v=t.isContentEditable?t.innerText.replace(/\u00a0/g,' ').replace(/\n+$/,''):t.value;
  setP(p,v);save();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.chk){setP(t.dataset.chk+'.done',t.checked);save();fillLists();return}
  if(t.dataset&&t.dataset.rerender){renderPanel(false);fillTabs(false)}
});
document.addEventListener('focusout',function(e){
  var p=e.target.dataset&&e.target.dataset.path;
  if(p&&/^days\.\d+\.(date|city)$/.test(p))fillTabs(false);
  if(p&&p==='trip.title'){document.title=S.trip.title;fillNav()}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&!e.shiftKey&&e.target.isContentEditable){e.preventDefault();e.target.blur()}
});
document.addEventListener('paste',function(e){
  if(e.target.isContentEditable){e.preventDefault();var tx=(e.clipboardData||window.clipboardData).getData('text/plain');document.execCommand('insertText',false,tx)}
});

render();
setInterval(tick,1000);
})();
</script>
</body>
</html>
